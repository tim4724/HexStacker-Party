name: Release

# Signed store builds:
#   - Android: .aab signed with the Play upload keystore, kept as a workflow
#     artifact, and released to Play's Android TV open testing track.
#     Versioned like tvOS below (tag -> versionName, run number -> versionCode,
#     offset to dodge hand-uploaded phoneTest codes), via -P overrides.
#   - tvOS: signed with the Apple Distribution cert + App Store profile and
#     uploaded straight to TestFlight via the ASC API key. The bare-semver tag
#     is the MARKETING_VERSION (the app shares the web's 4.X.Y version line)
#     and the run number the build number; project.yml's static values are
#     xcodebuild-overridden, not edited. The TestFlight build IS the release
#     candidate: there is no .ipa artifact, only the dSYMs for crash
#     symbolication. The appstore job then readies the App Store version with
#     that build; submitting it for review stays a step in App Store Connect.
#
# Trigger: a bare-semver release tag (the repo's tag convention). There is no
# manual run, so a change to this pipeline is tested by cutting a patch tag.
# Never runs for pull requests, so the signing secrets are only
# reachable by pushers. Each signing step fails fast with a named error when a
# secret is missing, rather than silently producing a debug-signed artifact.
# Each store upload is the last step of its job, so a failed upload has used up
# no build number and "Re-run failed jobs" is the retry; a fix needs a new tag.
#
# Secrets (Settings > Environments > release, which admits only release tags,
# so no branch can read them):
#   ANDROID_KEYSTORE_B64       base64 of the upload keystore .jks
#   ANDROID_KEYSTORE_PASSWORD  keystore store password
#   ANDROID_KEY_ALIAS          key alias (hexstacker-tv)
#   ANDROID_KEY_PASSWORD       key password
#   PLAY_SERVICE_ACCOUNT_JSON  JSON key of the Play API service account, granted
#                              "Release to testing tracks" on the app in Play
#                              Console (Users and permissions, not Cloud IAM)
#   APPLE_CERT_P12_B64         base64 .p12 export of the Apple Distribution cert + private key
#   APPLE_CERT_P12_PASSWORD    password chosen for that .p12 export
#   APPLE_PROFILE_B64          base64 of the "HexStacker tvOS App Store" .mobileprovision
#   ASC_API_KEY_P8_BASE64      base64 of the App Store Connect API key .p8
#   ASC_API_KEY_ID             key ID of that API key
#   ASC_API_ISSUER_ID          issuer ID of the ASC API key's team
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The canonical engine bundle ships inside the app (see :tv's
      # syncEngineBundle task), so it must exist before Gradle runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Build engine bundle (QuickJS core)
        run: npm run build:core

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # :tv's release signing reads android/keystore.properties (gitignored;
      # storeFile must be an absolute path). Keep the decoded keystore outside
      # the workspace.
      - name: Materialize the upload keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # The +100 reserves a band: codes below it belong to the manually built,
      # phone-installable `phoneTest` bundles (see android/tv/build.gradle.kts)
      # that Play's closed testers install, so a hand upload can never consume
      # a number a later tag would need. Raw run numbers would collide.
      #
      # Play rejects a reused versionCode, so stamp a unique one, and take the
      # versionName from the tag (bare semver, shared with the web release
      # line). Like the tvOS archive below, these are pure command-line
      # overrides: the static values in build.gradle.kts stay untouched.
      - name: Build release bundle (.aab)
        working-directory: android
        run: |
          set -eu
          ./gradlew :tv:bundleRelease --console=plain --stacktrace \
            "-PhexVersionCode=$((GITHUB_RUN_NUMBER + 100))" "-PhexVersionName=$GITHUB_REF_NAME"

      # The Gradle build falls back to debug signing when keystore.properties is
      # absent or unreadable, which would produce an artifact Play rejects, so
      # prove the upload key was picked up. An equality against the keystore's
      # own certificate, not a search for "Android Debug": that also passes when
      # keytool prints nothing at all.
      - name: Verify the release signature
        env:
          AAB: android/tv/build/outputs/bundle/release/tv-release.aab
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          want=$(keytool -exportcert -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -rfc |
            keytool -printcert | grep -m1 'SHA256:' | tr -d ' ')
          got=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | tr -d ' ')
          echo "keystore $want"
          echo "bundle   $got"
          if [ -z "$got" ] || [ "$want" != "$got" ]; then
            echo "::error::$AAB is not signed with the upload key"
            exit 1
          fi

      # Before publishing, so a Play-side rejection still leaves the bundle
      # downloadable from the run.
      - name: Upload .aab artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hexstacker-android-tv-aab
          path: android/tv/build/outputs/bundle/release/tv-release.aab
          if-no-files-found: error

      # "tv:" is the Android TV form factor prefix (tracks are named
      # "<prefix>:<track>"); tv:beta is that form factor's open testing track.
      # The app is leanback-only, so it belongs on the TV tracks, not the mobile
      # ones it shares a console with. Read the live list with androidpublisher
      # edits.tracks.list before changing this. tv:Alpha, the closed track, is
      # no longer published to; production is promoted in Play Console.
      #
      # Open testing goes out completed, not draft: joining is the tester's
      # choice, and Play still reviews the release. Point this at tv:production
      # and the draft gate has to come back. mapping.txt goes with it or every
      # crash report from an R8 build is unreadable.
      #
      # A commit while other changes are in review cancels that review and
      # resubmits everything together (Play's default; the action has no switch
      # for it), so don't tag while a production release is in review.
      - name: Publish to Play (Android TV open testing)
        id: play
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.couchgames.stacker
          releaseFiles: android/tv/build/outputs/bundle/release/tv-release.aab
          mappingFile: android/tv/build/outputs/mapping/release/mapping.txt
          tracks: tv:beta
          status: completed

      # While the app has an open rejection, Play refuses an edit that sends
      # itself for review. The release still lands, held until someone presses
      # "Send for review" in Play Console (same fallback as upload-play.js).
      - name: Publish to Play, held for review in the console
        if: steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.couchgames.stacker
          releaseFiles: android/tv/build/outputs/bundle/release/tv-release.aab
          mappingFile: android/tv/build/outputs/mapping/release/mapping.txt
          tracks: tv:beta
          status: completed
          changesNotSentForReview: true

  tvos:
    runs-on: xcode-27
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest stable Xcode 27
        run: |
          # Real bundles only (the image's Xcode_27.2.app is a symlink to a beta), no
          # betas, newest by the bundle's own version (the RC folder name sorts badly).
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' ! -name '*beta*' \
            | while read -r x; do echo "$(defaults read "$x/Contents/Info" CFBundleShortVersionString) $x"; done \
            | sort -V | tail -1 | cut -d' ' -f2-)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      # The app's "Sync engine JS" pre-build phase runs npm run build:core, so
      # the repo-root deps must be installed before xcodebuild archives.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci

      - name: Install XcodeGen
        run: brew install --quiet xcodegen

      - name: Generate the Xcode project
        working-directory: appletv
        run: xcodegen generate

      # Same cache as tvos.yml: LiveKitWebRTC is a large binary xcframework.
      - name: Cache SPM artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: appletv/.build-xcode/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('appletv/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Import the Apple Distribution cert into a throwaway keychain and install
      # the App Store provisioning profile named by project.yml. The keychain
      # password is random and never leaves the step; the keychain dies with the
      # ephemeral runner.
      - name: Set up signing (keychain + provisioning profile)
        env:
          APPLE_CERT_P12_B64: ${{ secrets.APPLE_CERT_P12_B64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          APPLE_PROFILE_B64: ${{ secrets.APPLE_PROFILE_B64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -eu
          # The upload's key too, so a missing one fails here and not after the archive.
          for v in APPLE_CERT_P12_B64 APPLE_CERT_P12_PASSWORD APPLE_PROFILE_B64 \
                   ASC_API_KEY_P8_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$APPLE_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_P12_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the imported key non-interactively.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/cert.p12"

          # Install the profile under its UUID so Xcode's manual signing
          # (PROVISIONING_PROFILE_SPECIFIER in project.yml) can resolve it by name.
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$APPLE_PROFILE_B64" | base64 --decode > "$PROFILE"
          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      # Device SDK (generic/platform=tvOS), unlike the simulator builds in
      # tvos.yml. The scheme's Archive post-action synthesizes the LiveKitWebRTC
      # dSYM so the archive passes Apple's upload checks.
      #
      # ASC rejects reused build numbers, so stamp a unique one, and take the
      # marketing version from the tag (bare semver, shared with the web
      # release line). Both are xcodebuild-level overrides; project.yml's
      # static values stay untouched.
      - name: Archive
        working-directory: appletv
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HexStacker.xcodeproj \
            -scheme HexStackerTV \
            -destination 'generic/platform=tvOS' \
            -archivePath build/HexStacker.xcarchive \
            -derivedDataPath .build-xcode \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" "MARKETING_VERSION=$GITHUB_REF_NAME"

      # Keep the debug symbols with the build, needed to symbolicate crash
      # reports for exactly this binary once the .ipa itself lives in TestFlight.
      # Before the upload, which stays the job's last step.
      - name: Upload dSYMs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hexstacker-tvos-dsyms
          path: appletv/build/HexStacker.xcarchive/dSYMs
          if-no-files-found: error

      # ExportOptions.plist has destination=upload, so "exporting" the archive
      # pushes the build to App Store Connect via the ASC API key.
      - name: Upload to App Store Connect
        working-directory: appletv
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -exportArchive \
            -archivePath build/HexStacker.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

  # Turns the TestFlight upload into an App Store version ready to submit
  # (appletv/scripts/prepare-release.js). Its own job on a cheap runner, since it
  # mostly waits for Apple to process the build, and so "Re-run failed jobs"
  # retries it alone with the build number the upload used.
  appstore:
    needs: tvos
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node builtins only: no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Prepare the App Store version
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_API_KEY_ID.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY"
          node appletv/scripts/prepare-release.js "$KEY" "$ASC_API_ISSUER_ID" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"
