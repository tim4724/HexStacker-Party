name: Docker Image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      sha_tag:
        description: "Image tag for this commit (sha)"
        value: ${{ jobs.build.outputs.sha_tag }}

env:
  REGISTRY: ghcr.io

# Jobs that need more say so themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha_tag: ${{ steps.out.outputs.sha_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # The commit in the pages' version label (see the Dockerfile).
          build-args: GIT_SHA=${{ github.sha }}

      # The sha tag is the one callers deploy: it names this exact commit's image
      # even on a branch whose moving tag has already been overwritten.
      - name: Capture tag for output
        id: out
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          SHA_TAG=$(printf '%s' "$TAGS" | tr ',' '\n' | grep ":sha-" | head -n1)
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
