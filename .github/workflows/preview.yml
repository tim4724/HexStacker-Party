name: Preview Deploy

on:
  push:
    branches:
      - '**'
      # main deploys to Hetzner instead (hetzner-deploy.yml).
      - '!main'
    # The image contains only the web app; native-port-only pushes would
    # rebuild and redeploy an identical image.
    paths-ignore:
      - 'android/**'
      - 'appletv/**'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  deploy:
    runs-on: [self-hosted, k8s]
    needs: build
    # Renovate's branches build (their PR's check) but never deploy: their
    # runs get the repo secrets.
    if: ${{ !startsWith(github.ref_name, 'renovate/') }}
    environment: preview
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.2

      - name: Write kubeconfig
        run: |
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      # One mapping for every workflow that names a preview resource, so the
      # namespace this creates is the one Preview Cleanup later deletes.
      - name: Resolve preview names
        id: names
        uses: ./.github/actions/branch-slug
        with:
          branch: ${{ github.ref_name }}

      - name: Prepare preview namespace
        uses: ./.github/actions/preview-namespace
        with:
          namespace: ${{ steps.names.outputs.namespace }}

      - name: Deploy preview to Kubernetes
        env:
          NS: ${{ steps.names.outputs.namespace }}
          HOST: ${{ steps.names.outputs.host }}
          IMAGE: ${{ needs.build.outputs.sha_tag }}
        run: |
          set -euo pipefail
          cat <<EOF | kubectl apply -n "$NS" -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: couch-games
          spec:
            revisionHistoryLimit: 3
            replicas: 1
            selector:
              matchLabels:
                app: couch-games
            template:
              metadata:
                labels:
                  app: couch-games
              spec:
                automountServiceAccountToken: false
                # The image runs as nodejs (uid 1001); declaring it makes a future image
                # that drops USER fail to start instead of running as root.
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1001
                  runAsGroup: 1001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: couch-games
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    image: ${IMAGE}
                    ports:
                      - containerPort: 4000
                        name: http
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: couch-games
          spec:
            selector:
              app: couch-games
            ports:
              - port: 4000
                targetPort: 4000
          ---
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: redirect-to-https
          spec:
            redirectScheme:
              scheme: https
              permanent: true
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: cg-https
          spec:
            entryPoints:
              - websecure
            routes:
              - match: Host(\`${HOST}\`)
                kind: Rule
                services:
                  - name: couch-games
                    port: 4000
            tls: {}
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: cg-http
          spec:
            entryPoints:
              - web
            routes:
              - match: Host(\`${HOST}\`)
                kind: Rule
                services:
                  - name: couch-games
                    port: 4000
                middlewares:
                  - name: redirect-to-https
          EOF

      - name: Publish preview URL
        env:
          HOST: ${{ steps.names.outputs.host }}
        run: |
          {
            echo "### Preview"
            echo "- URL: https://${HOST}"
          } >> "$GITHUB_STEP_SUMMARY"
