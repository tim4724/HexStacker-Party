name: Preview Cleanup

on:
  # delete fires for tags too and takes no branches filter (one was declared here
  # and silently ignored), so the branch check lives in the job condition below.
  delete:

permissions:
  contents: read

# Join the groups of both workflows that deploy into the branch's namespace
# (Preview Deploy here, TV Gallery on the job) and cancel whatever is in flight.
# Otherwise push-then-merge races: this deletes the namespace while the last
# push's deploy is still building, and that deploy then recreates it for a
# branch that no longer exists. Delete events carry the short branch name in
# event.ref, hence the spelled-out refs/heads/ to match preview's github.ref.
concurrency:
  group: preview-refs/heads/${{ github.event.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: [self-hosted, k8s]
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    concurrency:
      group: tv-gallery-${{ github.event.ref }}
      cancel-in-progress: true
    environment: preview
    timeout-minutes: 10
    steps:
      # Delete events run on the default branch, so this checks out main (the
      # deleted ref comes from the event payload). Needed for the local action.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.37.1

      - name: Write kubeconfig
        run: |
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      # The same mapping Preview Deploy used to create the namespace. This step
      # used to inline its own sed pipeline, which skipped the 50-char
      # truncation: deleting a long-named branch then targeted a namespace that
      # never existed and leaked the real one (silently, courtesy of
      # --ignore-not-found). It also interpolated the ref straight into the
      # script body, which a branch named with a $() would have executed here,
      # on the runner holding the cluster kubeconfig.
      - name: Resolve preview names
        id: names
        uses: ./.github/actions/branch-slug
        with:
          branch: ${{ github.event.ref }}

      - name: Delete preview namespace
        env:
          NS: ${{ steps.names.outputs.namespace }}
        run: |
          set -euo pipefail
          kubectl delete namespace "$NS" --ignore-not-found
