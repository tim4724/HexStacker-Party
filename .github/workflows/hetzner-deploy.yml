name: Hetzner Deploy

# Uploads site/ (npm run build:site) to Hetzner Webhosting over SFTP: main goes
# to main.hexstacker.com on every push, a release tag to hexstacker.com. Each
# host is its own folder under public_html on the account that also hosts
# paperballoon.games (account setup: that repo's README).
on:
  push:
    branches: [main]
    # Bare semver, the repo's release tag convention (matching release.yml).
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    # The upload is the web app only. (Tag pushes ignore path filters.)
    paths-ignore:
      - 'android/**'
      - 'appletv/**'
  workflow_dispatch:

permissions:
  contents: read

# One upload per host at a time: a newer push waits instead of cutting an
# upload off halfway.
concurrency:
  group: hetzner-deploy-${{ github.ref_type }}

jobs:
  # A release tag gets no Tests run of its own, so this gates the rollout.
  tests:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml

  # npm ci runs every dependency's install scripts, so the build stays out of
  # the job that holds the deploy key.
  build:
    needs: tests
    # Only main or a release tag (a manual run could start from any branch), and
    # only once the tests passed or were skipped (main). A cancelled test run
    # must block: failure() alone doesn't see it.
    if: >-
      !cancelled()
      && (github.ref_name == 'main' || github.ref_type == 'tag')
      && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build site
        env:
          APP_ENV: ${{ github.ref_type == 'tag' && 'production' || 'main' }}
          GIT_SHA: ${{ github.sha }}
        run: npm run build:site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: site
          include-hidden-files: true   # .htaccess and .well-known/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    # Spelled out: the implicit success() also sees tests, skipped on main.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # Holds the SFTP secrets; only main and release tags may use it.
    environment: hetzner
    timeout-minutes: 15
    env:
      HOST: ${{ github.ref_type == 'tag' && 'hexstacker.com' || 'main.hexstacker.com' }}
    steps:
      # For the upload action and package.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: site

      - name: Upload
        uses: ./.github/actions/hetzner-upload
        with:
          source: site
          remote: public_html/${{ env.HOST }}
          # main's /gallery-tv/ is uploaded by tv-gallery.yml.
          keep: gallery-tv/
          host: ${{ secrets.HETZNER_SFTP_HOST }}
          user: ${{ secrets.HETZNER_SFTP_USER }}
          key: ${{ secrets.HETZNER_SFTP_KEY }}
          known_hosts: ${{ secrets.HETZNER_SFTP_KNOWN_HOSTS }}

      # From GitHub's network, not from home: Hetzner blocks an address that
      # sends many requests. A bad .htaccess is a 500 on every path, and the
      # page names this build, so this is the upload just made.
      - name: Check
        run: |
          set -euo pipefail
          # As scripts/build-site.js labels the pages: the bare version on
          # production, with the commit elsewhere.
          LABEL=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_TYPE" = tag ] || LABEL="$LABEL (#${GITHUB_SHA:0:7})"
          curl -fsS -o /dev/null "https://$HOST/health"
          PAGE=$(curl -fsS "https://$HOST/")
          grep -qF "name=\"app-version\" content=\"$LABEL\"" <<< "$PAGE"
          echo "Deployed https://$HOST ($LABEL)" >> "$GITHUB_STEP_SUMMARY"
