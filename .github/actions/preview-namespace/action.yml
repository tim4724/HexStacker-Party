name: Preview namespace
description: >
  Create (idempotently) the per-branch preview namespace and everything every
  preview workload needs in it: scoped deployer RBAC and default-deny network
  policies with DNS + Traefik holes punched. Preview TLS needs nothing here:
  Traefik keeps ONE SNI-keyed certificate store across all namespaces, so the
  cert-manager wildcard in `default` already serves preview hosts. Copying it
  per namespace produced snapshots that never renewed and, once expired, won
  the SNI match over the live cert and took the apex domain down.
  Both Preview Deploy and TV Gallery land in the same namespace and
  either can get there first (a native-only branch deploys a gallery with no app
  preview), so both apply the whole set. Kept here so the two can't drift.

  Requires kubectl on PATH and KUBECONFIG already exported by the caller.

inputs:
  namespace:
    description: Namespace to create and prepare (see the branch-slug action).
    required: true
  traefik-cidr:
    description: Source CIDR allowed to reach pods in the namespace (the ingress controller).
    required: false
    default: 192.168.1.115/32

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NS: ${{ inputs.namespace }}
        TRAEFIK_CIDR: ${{ inputs.traefik-cidr }}
      run: |
        set -euo pipefail

        kubectl get ns "$NS" >/dev/null 2>&1 || kubectl create ns "$NS"

        # Grant the deployer SA permissions in this namespace (scoped RBAC).
        cat <<'RBAC' | kubectl apply -n "$NS" -f -
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: stacker-deployer
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: stacker-preview-resources
        subjects:
        - kind: ServiceAccount
          name: stacker-deployer
          namespace: github-runner
        RBAC

        # Network policies: default-deny + allow DNS + allow traefik ingress.
        cat <<NETPOL | kubectl apply -n "$NS" -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny-all
        spec:
          podSelector: {}
          policyTypes:
          - Ingress
          - Egress
        ---
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-dns
        spec:
          podSelector: {}
          policyTypes:
          - Egress
          egress:
          - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
            ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        ---
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-ingress-from-traefik
        spec:
          podSelector: {}
          policyTypes:
          - Ingress
          ingress:
          - from:
            - ipBlock:
                cidr: ${TRAEFIK_CIDR}
            ports:
            - protocol: TCP
        NETPOL
