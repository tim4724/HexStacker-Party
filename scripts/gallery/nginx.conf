# Clean extensionless URLs for the gallery pod: /gallery -> gallery.html,
# /gallery-tv/ -> index.html.
# Legacy .html URLs keep working via the plain $uri match.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # Traefik keeps the access log, rotated to the 7 days the privacy policy
  # promises. Container stdout has no age limit, so nothing is logged here.
  access_log off;
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
